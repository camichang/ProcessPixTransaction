spring:
  application:
    name: process-pix-transaction
  jpa:
    hibernate:
    ddl-auto: update
    show-sql: true
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true

websocket:
  enabled: true
  messaging:
    broker:
      relay:
        enabled: false


